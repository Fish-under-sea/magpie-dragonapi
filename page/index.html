<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DragonAPI</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    background: var(--magpie-bg, Canvas); color: var(--magpie-fg, CanvasText);
  }
  .box { text-align: center; color: var(--magpie-muted, GrayText); max-width: 32em; padding: 0 16px; }
  .box b { display: block; color: var(--magpie-fg, CanvasText); font-size: 14px; margin-bottom: 6px; }
  .box button {
    margin-top: 10px; padding: 4px 14px; font: inherit; cursor: pointer;
    border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit;
  }
  .box code { font-family: ui-monospace, Menlo, Consolas, monospace; user-select: all; }
</style>
</head>
<body>
  <div class="box">
    <b>DragonAPI</b>
    <span id="said">正在连接到本地服务…</span>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
